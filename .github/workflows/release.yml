name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ジョブ1：GitHubのクラウド環境でビルドしてReleaseを作る
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'

      - name: Test
        run: go test -v ./...

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -o shared .

      - name: Create Release and Upload Binary
        uses: softprops/action-gh-release@v2
        with:
          files: shared
          generate_release_notes: true

  # ジョブ2：ビルド完了後、オンプレのself-hostedランナーで自動デプロイ
  deploy:
    needs: build-and-release # ← ジョブ1が成功した後に自動実行される
    runs-on: [ self-hosted ]
    steps:
      - name: Download release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # タグ名（github.ref_name）を指定してReleaseから直接ダウンロード
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "shared" \
            --dir /tmp \
            --clobber

      - name: Install and Restart Service
        run: |
          chmod +x /tmp/shared
          sudo mv /tmp/shared /usr/local/bin/shared
          sudo systemctl restart shared